[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
vault_password_file = ~/.config/ansible/aac-coding-vault-pass
# `stdout_callback = yaml` used to select community.general.yaml, which was
# removed in community.general 12.0.0. The built-in default callback with
# result_format=yaml is the supported replacement and renders identically.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 5

[ssh_connection]
pipelining = True
